<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Checklist</title>
<style>
  :root { --fg:#222; --muted:#888; --bg:#fafafa; --card:#fff; --accent:#2b8a3e; --line:#e3e3e3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:480px; margin:0 auto; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  h2 { font-size:14px; color:var(--muted); margin:0 0 12px; font-weight:normal; }
  button { font:inherit; cursor:pointer; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .nav strong { font-size:18px; }
  .rate { font-size:40px; font-weight:bold; text-align:center; margin:8px 0; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); transition:width .2s; }
  form { display:flex; gap:8px; margin-bottom:12px; }
  form button { white-space:nowrap; }
  #taskInput { flex:1; min-width:0; padding:8px; font:inherit; border:1px solid var(--line); border-radius:6px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  li label { flex:1; display:flex; align-items:center; gap:8px; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li .tag { font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:0 4px; margin-left:4px; }
  #repeatInput { font:inherit; padding:0 4px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .weekdays { display:flex; gap:4px; margin:-4px 0 12px; }
  .weekdays[hidden] { display:none; }
  .weekdays button { flex:1; padding:6px 0; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .weekdays button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  li .del { border:none; background:none; color:var(--muted); font-size:18px; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; }
  .week { display:flex; align-items:flex-end; justify-content:space-between; height:140px; gap:6px; }
  .day { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; cursor:pointer; }
  .day .col { flex:1; width:100%; display:flex; flex-direction:column; justify-content:flex-end; }
  .day .fill { background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; }
  .day.none .fill { background:var(--line); }
  .day small { font-size:11px; color:var(--muted); margin-top:4px; }
  .day.current small { color:var(--fg); font-weight:bold; }
  .strip { position:relative; display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .strip::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 48px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .chip small { font-size:11px; color:var(--muted); }
  .chip b { font-size:16px; }
  .chip i { width:6px; height:6px; border-radius:50%; background:transparent; }
  .chip i.some { background:#f0b429; }
  .chip i.full { background:var(--accent); }
  .chip.today { border-color:var(--accent); }
  .chip.selected { background:var(--accent); border-color:var(--accent); }
  .chip.selected small, .chip.selected b { color:#fff; }
  .chip.selected i.some, .chip.selected i.full { background:#fff; }
</style>
</head>
<body>
<main>
  <section>
    <div class="strip" id="strip"></div>
    <div class="nav">
      <button id="prev">←</button>
      <strong id="date"></strong>
      <button id="next">→</button>
    </div>
    <div class="rate" id="rate"></div>
    <div class="bar"><div id="barFill"></div></div>
  </section>

  <section>
    <form id="addForm">
      <input id="taskInput" placeholder="やることを追加" autocomplete="off">
      <select id="repeatInput">
        <option value="once">1回</option>
        <option value="daily">毎日</option>
        <option value="weekly">毎週</option>
      </select>
      <button type="submit">追加</button>
    </form>
    <div class="weekdays" id="weekdays" hidden></div>
    <ul id="list"></ul>
  </section>

  <section>
    <h2>過去7日の達成率</h2>
    <div class="week" id="week"></div>
  </section>
</main>

<script>
  const STORAGE_KEY = 'daily-checklist';
  const REPEAT_KEY = 'daily-checklist-repeats';

  // toISOString() は UTC になり日本時間の朝 9 時前に日付がずれるため、ローカル日付で組み立てる
  function toKey(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function addDays(d, n) {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadRepeats() {
    try { return JSON.parse(localStorage.getItem(REPEAT_KEY)) || []; }
    catch { return []; }
  }
  function saveRepeats() {
    localStorage.setItem(REPEAT_KEY, JSON.stringify(repeats));
  }

  // data: { "2026-10-26": [{ id, text, done }, ...], ... }
  const data = load();
  // repeats: [{ id, text, from, until, days, done: { "2026-10-26": true } }, ...]
  // from 以降・until より前の日に出る。days（0=日〜6=土）があればその曜日だけ、無ければ毎日。
  // やめても until で止めるだけなので過去の記録は残る
  const repeats = loadRepeats();
  let current = new Date();

  const WEEKDAYS = '日月火水木金土';
  function weekdayOf(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getDay();
  }
  function repeatLabel(r) {
    return r.days ? '毎週 ' + r.days.map(d => WEEKDAYS[d]).join('・') : '毎日';
  }
  function repeatsOf(key) {
    const wd = weekdayOf(key);
    return repeats.filter(r => r.from <= key && (!r.until || key < r.until) && (!r.days || r.days.includes(wd)));
  }
  function tasksOf(key) {
    const daily = repeatsOf(key).map(r => ({ id: r.id, text: r.text, done: !!r.done[key], repeat: r }));
    return [...daily, ...(data[key] || [])];
  }
  function rateOf(key) {
    const tasks = tasksOf(key);
    if (tasks.length === 0) return null;
    return Math.round(tasks.filter(t => t.done).length / tasks.length * 100);
  }

  // 今日の前後を基本の範囲にし、表示中の日付がはみ出したらそこまで広げる
  const STRIP_PAST = 60, STRIP_FUTURE = 14;
  let stripScrolledKey = null;

  function renderStrip() {
    const strip = document.getElementById('strip');
    const today = new Date();
    const todayKey = toKey(today);
    const currentKey = toKey(current);
    const start = addDays(today, -STRIP_PAST) < current ? addDays(today, -STRIP_PAST) : addDays(current, -3);
    const end = addDays(today, STRIP_FUTURE) > current ? addDays(today, STRIP_FUTURE) : addDays(current, 3);

    // 作り直すと横位置が戻るので、日付が変わっていなければ元の位置に戻す
    const keepLeft = strip.scrollLeft;
    strip.innerHTML = '';
    let selected = null;
    for (let d = new Date(start); toKey(d) <= toKey(end); d = addDays(d, 1)) {
      const key = toKey(d);
      const r = rateOf(key);
      const chip = document.createElement('button');
      chip.className = 'chip' + (key === todayKey ? ' today' : '') + (key === currentKey ? ' selected' : '');
      chip.innerHTML =
        `<small>${'日月火水木金土'[d.getDay()]}</small>` +
        `<b>${d.getDate()}</b>` +
        `<i class="${!r ? '' : r === 100 ? 'full' : 'some'}"></i>`;
      const date = new Date(d);
      chip.onclick = () => { current = date; render(); };
      strip.append(chip);
      if (key === currentKey) selected = chip;
    }

    if (stripScrolledKey === currentKey) {
      strip.scrollLeft = keepLeft;
    } else {
      // scrollIntoView はページごと縦に動くため、帯の中だけで中央に寄せる
      strip.scrollLeft = selected.offsetLeft - (strip.clientWidth - selected.offsetWidth) / 2;
      stripScrolledKey = currentKey;
    }
  }

  function render() {
    renderStrip();
    const key = toKey(current);
    const isToday = key === toKey(new Date());
    document.getElementById('date').textContent =
      `${current.getMonth() + 1}/${current.getDate()}（${'日月火水木金土'[current.getDay()]}）${isToday ? ' 今日' : ''}`;

    const rate = rateOf(key);
    document.getElementById('rate').textContent = rate === null ? '-' : `${rate}%`;
    document.getElementById('barFill').style.width = `${rate || 0}%`;

    const list = document.getElementById('list');
    list.innerHTML = '';
    const tasks = tasksOf(key);
    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">タスクがありません</li>';
    }
    for (const task of tasks) {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = task.done;
      cb.onchange = () => {
        if (task.repeat) {
          if (cb.checked) task.repeat.done[key] = true;
          else delete task.repeat.done[key];
          saveRepeats();
        } else {
          task.done = cb.checked;
          save();
        }
        render();
      };
      const span = document.createElement('span');
      span.textContent = task.text;
      label.append(cb, span);
      if (task.repeat) {
        const tag = document.createElement('small');
        tag.className = 'tag';
        tag.textContent = repeatLabel(task.repeat);
        label.append(tag);
      }
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = () => {
        if (task.repeat) {
          if (!confirm(`「${task.text}」の繰り返しをこの日からやめますか？（前の日の記録は残ります）`)) return;
          task.repeat.until = key;
          saveRepeats(); render();
          return;
        }
        data[key] = (data[key] || []).filter(t => t.id !== task.id);
        if (data[key].length === 0) delete data[key];
        save(); render();
      };
      li.append(label, del);
      list.append(li);
    }

    // 表示中の日付を右端に、そこから遡って 7 日分
    const week = document.getElementById('week');
    week.innerHTML = '';
    for (let i = 6; i >= 0; i--) {
      const d = addDays(current, -i);
      const r = rateOf(toKey(d));
      const day = document.createElement('div');
      day.className = 'day' + (r === null ? ' none' : '') + (i === 0 ? ' current' : '');
      day.title = r === null ? '記録なし' : `${r}%`;
      day.innerHTML =
        `<small>${r === null ? '-' : r + '%'}</small>` +
        `<div class="col"><div class="fill" style="height:${r || 0}%"></div></div>` +
        `<small>${d.getMonth() + 1}/${d.getDate()}</small>`;
      day.onclick = () => { current = d; render(); };
      week.append(day);
    }
  }

  document.getElementById('addForm').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    const key = toKey(current);
    const repeatInput = document.getElementById('repeatInput');
    if (repeatInput.value !== 'once') {
      const days = repeatInput.value === 'weekly'
        ? (weekDays.size ? [...weekDays].sort((a, b) => (a + 6) % 7 - (b + 6) % 7) : [current.getDay()])
        : null;
      repeats.push({ id: Date.now(), text, from: key, until: null, days, done: {} });
      saveRepeats();
    } else {
      data[key] = [...(data[key] || []), { id: Date.now(), text, done: false }];
      save();
    }
    input.value = '';
    repeatInput.value = 'once';
    renderWeekdays();
    render();
  };

  // 「毎週」を選んだときだけ曜日を選ばせる。最初は表示中の日の曜日だけ選んだ状態にする
  let weekDays = new Set();
  function renderWeekdays() {
    const box = document.getElementById('weekdays');
    box.hidden = document.getElementById('repeatInput').value !== 'weekly';
    box.innerHTML = '';
    [1, 2, 3, 4, 5, 6, 0].forEach(d => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = WEEKDAYS[d];
      b.className = weekDays.has(d) ? 'on' : '';
      b.onclick = () => {
        weekDays.has(d) ? weekDays.delete(d) : weekDays.add(d);
        renderWeekdays();
      };
      box.append(b);
    });
  }
  document.getElementById('repeatInput').onchange = () => {
    weekDays = new Set([current.getDay()]);
    renderWeekdays();
  };
  document.getElementById('prev').onclick = () => { current = addDays(current, -1); render(); };
  document.getElementById('next').onclick = () => { current = addDays(current, 1); render(); };

  render();
</script>
</body>
</html>
