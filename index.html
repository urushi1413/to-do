<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Checklist</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS は manifest の icons を読まないため、ホーム画面用に専用で指定する -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Checklist">
<meta name="theme-color" content="#2b8a3e">
<style>
  :root { --fg:#222; --muted:#888; --bg:#fafafa; --card:#fff; --accent:#2b8a3e; --line:#e3e3e3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:480px; margin:0 auto; padding:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  h2 { font-size:14px; color:var(--muted); margin:0 0 12px; font-weight:normal; }
  button { font:inherit; cursor:pointer; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .nav strong { font-size:18px; }
  .rate { font-size:40px; font-weight:bold; text-align:center; margin:8px 0; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); transition:width .2s; }
  form { display:flex; gap:8px; margin-bottom:12px; }
  form button { white-space:nowrap; }
  #taskInput { flex:1; min-width:0; padding:8px; font:inherit; border:1px solid var(--line); border-radius:6px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  li label { flex:1; display:flex; align-items:center; gap:8px; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  .tag { font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:0 4px; margin-left:4px; }
  #repeatInput { font:inherit; padding:0 4px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .weekdays { display:flex; gap:4px; margin:-4px 0 12px; }
  .weekdays[hidden] { display:none; }
  .weekdays button { flex:1; padding:6px 0; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .weekdays button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  li .del { border:none; background:none; color:var(--muted); font-size:18px; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; }
  .week { display:flex; align-items:flex-end; justify-content:space-between; height:140px; gap:6px; }
  .day { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; cursor:pointer; }
  .day .col { flex:1; width:100%; display:flex; flex-direction:column; justify-content:flex-end; }
  .day .fill { background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; }
  .day.none .fill { background:var(--line); }
  .day small { font-size:11px; color:var(--muted); margin-top:4px; }
  .day.current small { color:var(--fg); font-weight:bold; }
  .strip { position:relative; display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .strip::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 48px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .chip small { font-size:11px; color:var(--muted); }
  .chip b { font-size:16px; }
  .chip i { width:6px; height:6px; border-radius:50%; background:transparent; }
  .chip i.some { background:#f0b429; }
  .chip i.full { background:var(--accent); }
  .chip.today { border-color:var(--accent); }
  .chip.selected { background:var(--accent); border-color:var(--accent); }
  .chip.selected small, .chip.selected b { color:#fff; }
  .chip.selected i.some, .chip.selected i.full { background:#fff; }
  .tabs, .seg { display:flex; gap:4px; padding:4px; margin-bottom:16px; background:var(--line); border-radius:8px; }
  .tabs button, .seg button { flex:1; padding:8px 0; border:none; border-radius:6px; background:none; color:var(--fg); }
  .tabs button.on, .seg button.on { background:var(--card); font-weight:bold; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  .seg { margin-bottom:12px; }
  [hidden] { display:none !important; }
  .tiles { display:flex; gap:8px; }
  .tile { flex:1; text-align:center; }
  .tile b { display:block; font-size:24px; }
  .tile small { font-size:11px; color:var(--muted); }
  .bars { display:flex; align-items:flex-end; height:100px; gap:2px; }
  .bars div { flex:1; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; }
  .bars div.none { background:var(--line); }
  .bars-axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
  .habit { padding:10px 0; border-bottom:1px solid var(--line); }
  .habit:last-child { border-bottom:none; }
  .habit-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
  .habit-head b { font-size:18px; }
  .habit small { font-size:12px; color:var(--muted); }
  .row-form { display:flex; gap:8px; margin-bottom:12px; }
  .row-form input { flex:1; min-width:0; padding:8px; font:inherit; border:1px solid var(--line); border-radius:6px; }
  .row-form select { font:inherit; padding:0 4px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .row-form button { white-space:nowrap; }
  h2 b { color:var(--fg); }
  h3 { font-size:13px; margin:16px 0 4px; }
  li small.when { font-size:11px; color:var(--muted); white-space:nowrap; }
  .note-date { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:-4px 0 4px; }
  .note-date input { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  .backup { display:flex; gap:8px; }
  .backup button { flex:1; padding:8px 0; }
  .hint { font-size:12px; color:var(--muted); margin:8px 0 0; }
  .banner { background:#fff8e1; border:1px solid #f0b429; border-radius:8px; padding:12px; margin-bottom:16px; font-size:14px; }
  .banner div { display:flex; gap:8px; margin-top:8px; }
  .banner button { flex:1; padding:6px 0; }
  .badges { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .badge { text-align:center; padding:10px 4px; border:1px solid var(--line); border-radius:8px; }
  .badge .icon { font-size:28px; line-height:1.2; }
  .badge b { display:block; font-size:12px; margin-top:4px; }
  .badge small { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
  .badge.locked .icon { filter:grayscale(1); opacity:.35; }
  .badge.locked b { color:var(--muted); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); width:max-content; max-width:90vw; background:#222; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:10; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:9; }
</style>
</head>
<body>
<main>
  <div class="banner" id="backupBanner" hidden>
    <span id="backupMsg"></span>
    <div>
      <button id="bannerExport">書き出す</button>
      <button id="bannerLater">あとで</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="today" class="on">チェック</button>
    <button data-tab="stats">統計</button>
    <button data-tab="record">記録</button>
  </div>

  <div id="todayView">
  <section>
    <div class="strip" id="strip"></div>
    <div class="nav">
      <button id="prev">←</button>
      <strong id="date"></strong>
      <button id="next">→</button>
    </div>
    <div class="rate" id="rate"></div>
    <div class="bar"><div id="barFill"></div></div>
  </section>

  <section>
    <form id="addForm">
      <input id="taskInput" placeholder="やることを追加" autocomplete="off">
      <select id="repeatInput">
        <option value="once">1回</option>
        <option value="daily">毎日</option>
        <option value="weekly">毎週</option>
      </select>
      <button type="submit">追加</button>
    </form>
    <div class="weekdays" id="weekdays" hidden></div>
    <ul id="list"></ul>
  </section>

  <section>
    <h2>過去7日の達成率</h2>
    <div class="week" id="week"></div>
  </section>
  </div>

  <div id="statsView" hidden>
    <div class="seg" id="period">
      <button data-days="7" class="on">7日</button>
      <button data-days="30">30日</button>
      <button data-days="all">全期間</button>
    </div>
    <section>
      <div class="tiles">
        <div class="tile"><b id="statAvg"></b><small>平均達成率</small></div>
        <div class="tile"><b id="statDone"></b><small>完了したタスク</small></div>
        <div class="tile"><b id="statFull"></b><small>100% の日</small></div>
      </div>
    </section>
    <section>
      <h2>日ごとの達成率</h2>
      <div class="bars" id="statBars"></div>
      <div class="bars-axis"><span id="statFrom"></span><span>昨日</span></div>
    </section>
    <section>
      <h2>繰り返しタスク別</h2>
      <div id="statHabits"></div>
    </section>
    <section>
      <h2>バッジ <b id="badgeCount"></b></h2>
      <div class="badges" id="badges"></div>
    </section>
  </div>
  <div id="recordView" hidden>
    <section>
      <h2>人生リスト <b id="lifeCount"></b></h2>
      <form class="row-form" id="lifeForm">
        <input id="lifeInput" placeholder="いつかやりたいこと" autocomplete="off">
        <button type="submit">追加</button>
      </form>
      <ul id="lifeList"></ul>
    </section>

    <section>
      <div class="nav">
        <button id="monthPrev">←</button>
        <strong id="monthLabel"></strong>
        <button id="monthNext">→</button>
      </div>
      <form class="row-form" id="noteForm" style="margin-top:12px">
        <input id="noteInput" placeholder="この月のできごと" autocomplete="off">
        <button type="submit">追加</button>
      </form>
      <label class="note-date">日付 <input type="date" id="noteDate"></label>
      <h3>できごと</h3>
      <ul id="noteList"></ul>
      <h3>習慣の達成率</h3>
      <div id="monthHabits"></div>
    </section>

    <section>
      <h2>バックアップ</h2>
      <div class="backup">
        <button id="exportBtn">書き出し</button>
        <button id="importBtn">読み込み</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="hint">記録はこのスマホの中にだけ保存されています。機種変更やブラウザのデータ削除で消えるので、ときどき書き出してファイルを保存しておいてください。</p>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>
<canvas id="confetti" hidden></canvas>

<script>
  const STORAGE_KEY = 'daily-checklist';
  const REPEAT_KEY = 'daily-checklist-repeats';
  const LIFE_KEY = 'daily-checklist-life';
  const NOTES_KEY = 'daily-checklist-notes';
  // バッジ: { earned: { バッジID: 獲得した日 }, initialized }
  const BADGE_KEY = 'daily-checklist-badges';
  // バックアップの声かけ用。いつ書き出したか・いつまで黙るか・いつから使っているか（いずれも日付キー）
  const BACKUP_KEY = 'daily-checklist-backup';

  // toISOString() は UTC になり日本時間の朝 9 時前に日付がずれるため、ローカル日付で組み立てる
  function toKey(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function addDays(d, n) {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function loadRepeats() {
    try { return JSON.parse(localStorage.getItem(REPEAT_KEY)) || []; }
    catch { return []; }
  }
  function saveRepeats() {
    localStorage.setItem(REPEAT_KEY, JSON.stringify(repeats));
  }

  function loadList(storageKey) {
    try { return JSON.parse(localStorage.getItem(storageKey)) || []; }
    catch { return []; }
  }
  function saveList(storageKey, list) {
    localStorage.setItem(storageKey, JSON.stringify(list));
  }

  // data: { "2026-10-26": [{ id, text, done }, ...], ... }
  const data = load();
  // repeats: [{ id, text, from, until, days, done: { "2026-10-26": true } }, ...]
  // from 以降・until より前の日に出る。days（0=日〜6=土）があればその曜日だけ、無ければ毎日。
  // やめても until で止めるだけなので過去の記録は残る
  const repeats = loadRepeats();
  // life: [{ id, text, doneOn }, ...] 日付の無い人生単位のリスト。doneOn は達成した日（未達成なら null）
  const life = loadList(LIFE_KEY);
  // notes: [{ id, month: "2026-11", text, date }, ...]
  // 以前は「達成 / 成長」を kind で分けていたが、1つのリストにまとめた。古い行の kind は読まずに残しておく
  const notes = loadList(NOTES_KEY);
  let current = new Date();

  const WEEKDAYS = '日月火水木金土';
  function weekdayOf(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getDay();
  }
  function repeatLabel(r) {
    return r.days ? '毎週 ' + r.days.map(d => WEEKDAYS[d]).join('・') : '毎日';
  }
  function repeatsOf(key) {
    const wd = weekdayOf(key);
    return repeats.filter(r => r.from <= key && (!r.until || key < r.until) && (!r.days || r.days.includes(wd)));
  }
  function tasksOf(key) {
    const daily = repeatsOf(key).map(r => ({ id: r.id, text: r.text, done: !!r.done[key], repeat: r }));
    return [...daily, ...(data[key] || [])];
  }
  function rateOf(key) {
    const tasks = tasksOf(key);
    if (tasks.length === 0) return null;
    return Math.round(tasks.filter(t => t.done).length / tasks.length * 100);
  }

  // 今日の前後を基本の範囲にし、表示中の日付がはみ出したらそこまで広げる
  const STRIP_PAST = 60, STRIP_FUTURE = 14;
  let stripScrolledKey = null;

  function renderStrip() {
    const strip = document.getElementById('strip');
    const today = new Date();
    const todayKey = toKey(today);
    const currentKey = toKey(current);
    const start = addDays(today, -STRIP_PAST) < current ? addDays(today, -STRIP_PAST) : addDays(current, -3);
    const end = addDays(today, STRIP_FUTURE) > current ? addDays(today, STRIP_FUTURE) : addDays(current, 3);

    // 作り直すと横位置が戻るので、日付が変わっていなければ元の位置に戻す
    const keepLeft = strip.scrollLeft;
    strip.innerHTML = '';
    let selected = null;
    for (let d = new Date(start); toKey(d) <= toKey(end); d = addDays(d, 1)) {
      const key = toKey(d);
      const r = rateOf(key);
      const chip = document.createElement('button');
      chip.className = 'chip' + (key === todayKey ? ' today' : '') + (key === currentKey ? ' selected' : '');
      chip.innerHTML =
        `<small>${'日月火水木金土'[d.getDay()]}</small>` +
        `<b>${d.getDate()}</b>` +
        `<i class="${!r ? '' : r === 100 ? 'full' : 'some'}"></i>`;
      const date = new Date(d);
      chip.onclick = () => { current = date; render(); };
      strip.append(chip);
      if (key === currentKey) selected = chip;
    }

    if (stripScrolledKey === currentKey) {
      strip.scrollLeft = keepLeft;
    } else {
      // scrollIntoView はページごと縦に動くため、帯の中だけで中央に寄せる
      strip.scrollLeft = selected.offsetLeft - (strip.clientWidth - selected.offsetWidth) / 2;
      stripScrolledKey = currentKey;
    }
  }

  function render() {
    checkBadges();
    renderStrip();
    const key = toKey(current);
    const isToday = key === toKey(new Date());
    document.getElementById('date').textContent =
      `${current.getMonth() + 1}/${current.getDate()}（${'日月火水木金土'[current.getDay()]}）${isToday ? ' 今日' : ''}`;

    const rate = rateOf(key);
    document.getElementById('rate').textContent = rate === null ? '-' : `${rate}%`;
    document.getElementById('barFill').style.width = `${rate || 0}%`;

    const list = document.getElementById('list');
    list.innerHTML = '';
    const tasks = tasksOf(key);
    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">タスクがありません</li>';
    }
    for (const task of tasks) {
      const li = document.createElement('li');
      li.className = task.done ? 'done' : '';
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = task.done;
      cb.onchange = () => {
        const before = rateOf(key);
        if (task.repeat) {
          if (cb.checked) task.repeat.done[key] = true;
          else delete task.repeat.done[key];
          saveRepeats();
        } else {
          task.done = cb.checked;
          save();
        }
        // 寝る系の項目は翌朝にチェックすることが多いので、過去の日でも 100% になった瞬間に出す
        if (before !== 100 && rateOf(key) === 100 && key <= toKey(new Date())) confetti();
        render();
      };
      const span = document.createElement('span');
      span.textContent = task.text;
      label.append(cb, span);
      if (task.repeat) {
        const tag = document.createElement('small');
        tag.className = 'tag';
        tag.textContent = repeatLabel(task.repeat);
        label.append(tag);
      }
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = () => {
        if (task.repeat) {
          if (!confirm(`「${task.text}」の繰り返しをこの日からやめますか？（前の日の記録は残ります）`)) return;
          task.repeat.until = key;
          saveRepeats(); render();
          return;
        }
        data[key] = (data[key] || []).filter(t => t.id !== task.id);
        if (data[key].length === 0) delete data[key];
        save(); render();
      };
      li.append(label, del);
      list.append(li);
    }

    // 表示中の日付を右端に、そこから遡って 7 日分
    const week = document.getElementById('week');
    week.innerHTML = '';
    for (let i = 6; i >= 0; i--) {
      const d = addDays(current, -i);
      // 未来の日はまだ終わっていないので、予定があっても 0% ではなく「-」にする
      const r = toKey(d) > toKey(new Date()) ? null : rateOf(toKey(d));
      const day = document.createElement('div');
      day.className = 'day' + (r === null ? ' none' : '') + (i === 0 ? ' current' : '');
      day.title = r === null ? '記録なし' : `${r}%`;
      day.innerHTML =
        `<small>${r === null ? '-' : r + '%'}</small>` +
        `<div class="col"><div class="fill" style="height:${r || 0}%"></div></div>` +
        `<small>${d.getMonth() + 1}/${d.getDate()}</small>`;
      day.onclick = () => { current = d; render(); };
      week.append(day);
    }
  }

  document.getElementById('addForm').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    const key = toKey(current);
    const repeatInput = document.getElementById('repeatInput');
    if (repeatInput.value !== 'once') {
      const days = repeatInput.value === 'weekly'
        ? (weekDays.size ? [...weekDays].sort((a, b) => (a + 6) % 7 - (b + 6) % 7) : [current.getDay()])
        : null;
      repeats.push({ id: Date.now(), text, from: key, until: null, days, done: {} });
      saveRepeats();
    } else {
      data[key] = [...(data[key] || []), { id: Date.now(), text, done: false }];
      save();
    }
    input.value = '';
    repeatInput.value = 'once';
    renderWeekdays();
    render();
  };

  // 「毎週」を選んだときだけ曜日を選ばせる。最初は表示中の日の曜日だけ選んだ状態にする
  let weekDays = new Set();
  function renderWeekdays() {
    const box = document.getElementById('weekdays');
    box.hidden = document.getElementById('repeatInput').value !== 'weekly';
    box.innerHTML = '';
    [1, 2, 3, 4, 5, 6, 0].forEach(d => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = WEEKDAYS[d];
      b.className = weekDays.has(d) ? 'on' : '';
      b.onclick = () => {
        weekDays.has(d) ? weekDays.delete(d) : weekDays.add(d);
        renderWeekdays();
      };
      box.append(b);
    });
  }
  document.getElementById('repeatInput').onchange = () => {
    weekDays = new Set([current.getDay()]);
    renderWeekdays();
  };
  document.getElementById('prev').onclick = () => { current = addDays(current, -1); render(); };
  document.getElementById('next').onclick = () => { current = addDays(current, 1); render(); };

  // ---- 統計 ----
  // 集計は表示中の日付ではなく「昨日まで」で区切る。今日と未来の日はまだ終わっていないので、
  // 途中の未チェックを「できなかった」と数えないようにする
  let period = '7';

  function statsRange() {
    const today = new Date();
    const end = addDays(today, -1);
    if (period !== 'all') return { start: addDays(today, -Number(period)), end };
    const keys = [...Object.keys(data), ...repeats.map(r => r.from)].filter(k => k <= toKey(end)).sort();
    if (keys.length === 0) return { start: today, end };
    const [y, m, d] = keys[0].split('-').map(Number);
    return { start: new Date(y, m - 1, d), end };
  }

  // その繰り返しタスクが key の日に予定されていたか
  function scheduled(r, key) {
    return r.from <= key && (!r.until || key < r.until) && (!r.days || r.days.includes(weekdayOf(key)));
  }

  // 今日から遡って何日連続で達成しているか。今日がまだ未チェックなら昨日から数える
  function streakOf(r) {
    let count = 0;
    let d = new Date();
    if (scheduled(r, toKey(d)) && !r.done[toKey(d)]) d = addDays(d, -1);
    for (; toKey(d) >= r.from; d = addDays(d, -1)) {
      const key = toKey(d);
      if (!scheduled(r, key)) continue;
      if (!r.done[key]) break;
      count++;
    }
    return count;
  }

  // 繰り返しタスクごとの達成率を box に並べる。days は集計する日付キーの配列
  function renderHabits(box, days, withStreak) {
    box.innerHTML = '';
    const rows = repeats
      .map(r => {
        const planned = days.filter(key => scheduled(r, key));
        const done = planned.filter(key => r.done[key]).length;
        return { r, planned: planned.length, done, rate: planned.length ? Math.round(done / planned.length * 100) : 0 };
      })
      .filter(x => x.planned > 0)
      .sort((a, b) => b.rate - a.rate);
    if (rows.length === 0) {
      box.innerHTML = days.length
        ? '<div class="empty">この期間の繰り返しタスクはありません</div>'
        : '<div class="empty">昨日までの記録がまだありません</div>';
    }
    for (const { r, planned, done, rate } of rows) {
      const row = document.createElement('div');
      row.className = 'habit';
      const head = document.createElement('div');
      head.className = 'habit-head';
      const name = document.createElement('span');
      name.textContent = r.text;
      const tag = document.createElement('small');
      tag.className = 'tag';
      tag.textContent = repeatLabel(r) + (r.until ? '（終了）' : '');
      name.append(' ', tag);
      const pct = document.createElement('b');
      pct.textContent = `${rate}%`;
      head.append(name, pct);
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.innerHTML = `<div style="width:${rate}%"></div>`;
      const note = document.createElement('small');
      const streak = withStreak && !r.until ? streakOf(r) : 0;
      note.textContent = `${done}/${planned}回` + (streak ? ` ・ ${streak}回連続` : '');
      row.append(head, bar, note);
      box.append(row);
    }
  }

  function renderStats() {
    const { start, end } = statsRange();
    const days = [];
    for (let d = new Date(start); toKey(d) <= toKey(end); d = addDays(d, 1)) days.push(toKey(d));

    let doneCount = 0, totalCount = 0, fullDays = 0, rateSum = 0, ratedDays = 0;
    const bars = document.getElementById('statBars');
    bars.innerHTML = '';
    for (const key of days) {
      const tasks = tasksOf(key);
      doneCount += tasks.filter(t => t.done).length;
      totalCount += tasks.length;
      const r = rateOf(key);
      if (r !== null) { rateSum += r; ratedDays++; }
      if (r === 100) fullDays++;
      const bar = document.createElement('div');
      bar.className = r === null ? 'none' : '';
      bar.style.height = `${r || 0}%`;
      bar.title = `${key} ${r === null ? '記録なし' : r + '%'}`;
      bars.append(bar);
    }
    document.getElementById('statAvg').textContent = ratedDays ? `${Math.round(rateSum / ratedDays)}%` : '-';
    document.getElementById('statDone').textContent = `${doneCount}/${totalCount}`;
    document.getElementById('statFull').textContent = `${fullDays}日`;
    document.getElementById('statFrom').textContent = days.length ? `${start.getMonth() + 1}/${start.getDate()}` : '';

    renderHabits(document.getElementById('statHabits'), days, true);
    renderBadges();
  }

  document.querySelectorAll('#tabs button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
      const tab = b.dataset.tab;
      document.getElementById('todayView').hidden = tab !== 'today';
      document.getElementById('statsView').hidden = tab !== 'stats';
      document.getElementById('recordView').hidden = tab !== 'record';
      if (tab === 'stats') renderStats();
      if (tab === 'record') renderRecord();
    };
  });
  document.querySelectorAll('#period button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#period button').forEach(x => x.classList.toggle('on', x === b));
      period = b.dataset.days;
      renderStats();
    };
  });

  // ---- 記録（人生リスト・月の記録） ----
  let recordMonth = new Date();
  recordMonth.setDate(1);

  function monthKeyOf(d) {
    return toKey(d).slice(0, 7);
  }
  function formatKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return `${y}/${m}/${d}`;
  }

  // 1行ぶんの li を作る。onToggle を渡すとチェックボックスが付く
  function recordItem({ text, done, when, tagText, onToggle, onDelete }) {
    const li = document.createElement('li');
    li.className = done ? 'done' : '';
    const label = document.createElement('label');
    if (onToggle) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = done;
      cb.onchange = () => onToggle(cb.checked);
      label.append(cb);
    }
    const span = document.createElement('span');
    span.textContent = text;
    label.append(span);
    if (tagText) {
      const tag = document.createElement('small');
      tag.className = 'tag';
      tag.textContent = tagText;
      label.append(tag);
    }
    li.append(label);
    if (when) {
      const w = document.createElement('small');
      w.className = 'when';
      w.textContent = when;
      li.append(w);
    }
    if (onDelete) {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = onDelete;
      li.append(del);
    }
    return li;
  }

  function renderRecord() {
    checkBadges();
    // 人生リスト：未達成を上に、達成済みは達成日の新しい順で下に
    const lifeList = document.getElementById('lifeList');
    lifeList.innerHTML = '';
    const doneCount = life.filter(x => x.doneOn).length;
    document.getElementById('lifeCount').textContent = life.length ? `${life.length}個中 ${doneCount}個達成` : '';
    const sorted = [...life.filter(x => !x.doneOn), ...life.filter(x => x.doneOn).sort((a, b) => b.doneOn.localeCompare(a.doneOn))];
    if (sorted.length === 0) lifeList.innerHTML = '<li class="empty">まだありません</li>';
    for (const item of sorted) {
      lifeList.append(recordItem({
        text: item.text,
        done: !!item.doneOn,
        when: item.doneOn ? formatKey(item.doneOn) : '',
        onToggle: checked => {
          item.doneOn = checked ? toKey(new Date()) : null;
          saveList(LIFE_KEY, life); renderRecord();
        },
        onDelete: () => {
          if (!confirm(`「${item.text}」を人生リストから消しますか？`)) return;
          life.splice(life.indexOf(item), 1);
          saveList(LIFE_KEY, life); renderRecord();
        },
      }));
    }

    // 月の記録：手で書いたメモに、その月に達成した人生リストの項目を自動で足す
    const month = monthKeyOf(recordMonth);
    document.getElementById('monthLabel').textContent = `${recordMonth.getFullYear()}年${recordMonth.getMonth() + 1}月`;
    // 日付はその月の中でだけ選べる。今月なら今日、過去の月ならその月の最終日を最初に入れておく
    const dateInput = document.getElementById('noteDate');
    const first = `${month}-01`;
    const last = toKey(new Date(recordMonth.getFullYear(), recordMonth.getMonth() + 1, 0));
    if (dateInput.min !== first) {
      dateInput.min = first;
      dateInput.max = last;
      dateInput.value = month === monthKeyOf(new Date()) ? toKey(new Date()) : last;
    }
    const ul = document.getElementById('noteList');
    ul.innerHTML = '';
    const entries = notes
      .filter(n => n.month === month)
      .map(n => ({ date: n.date, li: recordItem({
        text: n.text,
        when: formatKey(n.date).slice(5),
        onDelete: () => {
          if (!confirm(`「${n.text}」を消しますか？`)) return;
          notes.splice(notes.indexOf(n), 1);
          saveList(NOTES_KEY, notes); renderRecord();
        },
      }) }));
    for (const item of life.filter(x => x.doneOn && x.doneOn.startsWith(month))) {
      entries.push({ date: item.doneOn, li: recordItem({ text: item.text, when: formatKey(item.doneOn).slice(5), tagText: '人生リスト' }) });
    }
    entries.sort((a, b) => a.date.localeCompare(b.date));
    if (entries.length === 0) ul.innerHTML = '<li class="empty">まだありません</li>';
    entries.forEach(e => ul.append(e.li));

    // 習慣の達成率：その月の1日から月末まで。ただし統計と同じく昨日までで区切る
    const days = [];
    const yesterday = toKey(addDays(new Date(), -1));
    for (let d = new Date(recordMonth); monthKeyOf(d) === month && toKey(d) <= yesterday; d = addDays(d, 1)) days.push(toKey(d));
    renderHabits(document.getElementById('monthHabits'), days, false);
  }

  document.getElementById('lifeForm').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('lifeInput');
    const text = input.value.trim();
    if (!text) return;
    life.push({ id: Date.now(), text, doneOn: null });
    saveList(LIFE_KEY, life);
    input.value = '';
    renderRecord();
  };
  document.getElementById('noteForm').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('noteInput');
    const text = input.value.trim();
    if (!text) return;
    const month = monthKeyOf(recordMonth);
    const picked = document.getElementById('noteDate').value;
    const date = picked && picked.startsWith(month) ? picked : document.getElementById('noteDate').min;
    notes.push({ id: Date.now(), month, text, date });
    saveList(NOTES_KEY, notes);
    input.value = '';
    renderRecord();
  };
  document.getElementById('monthPrev').onclick = () => { recordMonth.setMonth(recordMonth.getMonth() - 1); renderRecord(); };
  document.getElementById('monthNext').onclick = () => { recordMonth.setMonth(recordMonth.getMonth() + 1); renderRecord(); };

  // ---- バックアップ ----
  function loadBackupState() {
    try { return JSON.parse(localStorage.getItem(BACKUP_KEY)) || {}; }
    catch { return {}; }
  }
  const backupState = loadBackupState();
  if (!backupState.since) {
    backupState.since = toKey(new Date());
    localStorage.setItem(BACKUP_KEY, JSON.stringify(backupState));
  }
  function markBackup(change) {
    Object.assign(backupState, change);
    localStorage.setItem(BACKUP_KEY, JSON.stringify(backupState));
    renderBackupBanner();
  }

  // 最後に書き出してから（一度も無ければ使い始めてから）30 日たち、記録が何かあるときだけ出す
  const BACKUP_INTERVAL = 30, SNOOZE_DAYS = 7;
  function renderBackupBanner() {
    const today = toKey(new Date());
    const base = backupState.lastExport || backupState.since;
    const hasRecords = Object.keys(data).length || repeats.length || life.length || notes.length;
    const due = hasRecords
      && toKey(addDays(new Date(), -BACKUP_INTERVAL)) >= base
      && !(backupState.snoozeUntil && today < backupState.snoozeUntil);
    document.getElementById('backupBanner').hidden = !due;
    document.getElementById('backupMsg').textContent = backupState.lastExport
      ? `最後のバックアップから ${BACKUP_INTERVAL} 日以上たちました。書き出しておきませんか？`
      : 'まだ一度もバックアップしていません。機種変更に備えて書き出しておきませんか？';
  }

  async function exportBackup() {
    const backup = { app: 'to-do', version: 1, exportedAt: new Date().toISOString(), data, repeats, life, notes };
    const name = `to-do-backup-${toKey(new Date())}.json`;
    const file = new File([JSON.stringify(backup)], name, { type: 'application/json' });
    // ホーム画面から開いた iPhone ではダウンロードが効かないことがあるので、共有シートを優先する
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        markBackup({ lastExport: toKey(new Date()) });
      } catch { /* キャンセル。書き出せていないので声かけは残す */ }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    markBackup({ lastExport: toKey(new Date()) });
  }
  document.getElementById('exportBtn').onclick = exportBackup;
  document.getElementById('bannerExport').onclick = exportBackup;
  document.getElementById('bannerLater').onclick = () => markBackup({ snoozeUntil: toKey(addDays(new Date(), SNOOZE_DAYS)) });
  document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let backup;
    try { backup = JSON.parse(await file.text()); } catch { backup = null; }
    const valid = backup && backup.app === 'to-do'
      && typeof backup.data === 'object' && !Array.isArray(backup.data)
      && [backup.repeats, backup.life, backup.notes].every(Array.isArray);
    if (!valid) { alert('このアプリのバックアップファイルではないようです'); return; }
    if (!confirm('今このスマホにある記録は、ファイルの中身で置き換わります。読み込みますか？')) return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(backup.data));
    localStorage.setItem(REPEAT_KEY, JSON.stringify(backup.repeats));
    localStorage.setItem(LIFE_KEY, JSON.stringify(backup.life));
    localStorage.setItem(NOTES_KEY, JSON.stringify(backup.notes));
    location.reload();
  };

  // ---- バッジ ----
  // すべて今あるデータから自動で判定する。一度もらったバッジは、あとで記録が途切れても消さない
  function loadBadges() {
    try { return JSON.parse(localStorage.getItem(BADGE_KEY)) || { earned: {} }; }
    catch { return { earned: {} }; }
  }
  const badgeState = loadBadges();

  // 一番古い記録の日から今日までの日付キー
  function daysUntilToday() {
    const today = toKey(new Date());
    const keys = [...Object.keys(data), ...repeats.map(r => r.from)].filter(k => k <= today).sort();
    if (keys.length === 0) return [];
    const [y, m, d] = keys[0].split('-').map(Number);
    const days = [];
    for (let x = new Date(y, m - 1, d); toKey(x) <= today; x = addDays(x, 1)) days.push(toKey(x));
    return days;
  }

  // 繰り返しタスクの、これまでで一番長い連続達成回数
  function bestStreakOf(r, days) {
    let best = 0, run = 0;
    for (const key of days) {
      if (!scheduled(r, key)) continue;
      if (r.done[key]) { run++; best = Math.max(best, run); }
      else if (key < toKey(new Date())) run = 0;  // 今日の未チェックはまだ途切れたとは数えない
    }
    return best;
  }

  // 段階のあるバッジを作る。獲得済みのものと、まだ届いていない最初の1つ（次の目標）だけを返す。
  // チェックを外して value が下がっても、獲得済みの段は残す
  function ladder(id, icon, steps, value, name) {
    const list = [];
    for (const step of steps) {
      const badgeId = `${id}-${step}`;
      list.push({ id: badgeId, icon, name: name(step), value, step });
      if (value < step && !badgeState.earned[badgeId]) break;
    }
    return list;
  }

  function badgeList() {
    const days = daysUntilToday();
    const rates = days.map(rateOf);
    const fullDays = rates.filter(r => r === 100).length;
    let bestFullRun = 0, run = 0;
    for (const r of rates) { run = r === 100 ? run + 1 : 0; bestFullRun = Math.max(bestFullRun, run); }
    const checks = days.reduce((n, key) => n + tasksOf(key).filter(t => t.done).length, 0);
    const recordedDays = days.filter(key => tasksOf(key).some(t => t.done)).length;
    const lifeDone = life.filter(x => x.doneOn).length;

    return [
      ...repeats.flatMap(r => ladder(`streak-${r.id}`, '🔥', [3, 7, 14, 30, 100], bestStreakOf(r, days), n => `${r.text} ${n}回連続`)),
      ...ladder('full', '💯', [1, 10, 30, 100], fullDays, n => n === 1 ? '初めての100%' : `100%の日 ${n}日`),
      ...ladder('fullweek', '👑', [7], bestFullRun, () => '7日連続100%'),
      ...ladder('checks', '✅', [10, 100, 500, 1000], checks, n => `チェック ${n}個`),
      ...ladder('life', '⛰️', [1, 5, 10], lifeDone, n => n === 1 ? '人生リスト初達成' : `人生リスト ${n}個`),
      ...ladder('days', '📅', [7, 30, 100, 365], recordedDays, n => `記録 ${n}日`),
    ];
  }

  // 新しく条件を満たしたバッジを保存して知らせる。初回はこれまでの分をまとめて1回だけ知らせる
  function checkBadges() {
    const newly = badgeList().filter(b => b.value >= b.step && !badgeState.earned[b.id]);
    if (newly.length === 0 && badgeState.initialized) return;
    newly.forEach(b => { badgeState.earned[b.id] = toKey(new Date()); });
    if (!badgeState.initialized) {
      badgeState.initialized = true;
      if (newly.length) toast(`これまでの記録で ${newly.length}個のバッジを獲得しました`);
    } else {
      toast(`${newly[0].icon} バッジ獲得：${newly[0].name}` + (newly.length > 1 ? ` ほか${newly.length - 1}個` : ''));
    }
    localStorage.setItem(BADGE_KEY, JSON.stringify(badgeState));
  }

  function renderBadges() {
    const box = document.getElementById('badges');
    box.innerHTML = '';
    // 繰り返しをやめたタスクの未獲得バッジは、もう取れないので出さない
    const ended = new Set(repeats.filter(r => r.until).map(r => `streak-${r.id}`));
    const list = badgeList().filter(b => badgeState.earned[b.id] || !ended.has(b.id.replace(/-\d+$/, '')));
    const earnedCount = list.filter(b => badgeState.earned[b.id]).length;
    document.getElementById('badgeCount').textContent = `${earnedCount}個`;
    list.sort((a, b) => !!badgeState.earned[b.id] - !!badgeState.earned[a.id]);
    for (const b of list) {
      const got = badgeState.earned[b.id];
      const el = document.createElement('div');
      el.className = 'badge' + (got ? '' : ' locked');
      el.innerHTML = `<div class="icon">${b.icon}</div><b></b><small></small>`;
      el.querySelector('b').textContent = b.name;
      el.querySelector('small').textContent = got ? formatKey(got) : `あと${b.step - b.value}`;
      box.append(el);
    }
  }

  let toastTimer;
  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = document.getElementById('confetti');
    canvas.hidden = false;
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['#2b8a3e', '#f0b429', '#e2483d', '#4c6ef5', '#ff8fab'];
    const pieces = Array.from({ length: 120 }, () => ({
      x: canvas.width / 2, y: canvas.height / 3,
      vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 4,
      size: Math.random() * 6 + 4, rot: Math.random() * Math.PI, color: colors[Math.floor(Math.random() * colors.length)],
    }));
    const startAt = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of pieces) {
        p.vy += .4; p.x += p.vx; p.y += p.vy; p.rot += .2;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      if (t - startAt < 1800) requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.hidden = true; }
    })(startAt);
  }

  render();
  renderBackupBanner();
</script>
</body>
</html>
